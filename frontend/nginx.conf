# =====================================================================
# Servidor del frontend. Estatico, pequeño y con dos decisiones tomadas:
#
# 1. ⛔ `index.html` y el codigo NO se cachean sin revalidar. Esta
#    aplicacion no tiene paso de construccion, asi que los archivos
#    conservan su nombre entre versiones: si el navegador se queda con el
#    CSS o el JS viejos, el usuario ve la version anterior y nadie
#    entiende por que. Paso de verdad el 20 de septiembre de 2026
#    verificando la aplicacion: el arreglo estaba en el servidor y el
#    navegador seguia pintando lo de antes.
#    `no-cache` no significa «no guardes»: significa «pregunta antes de
#    usar». Los archivos son pequeños y la respuesta suele ser 304.
#
# 2. Las cabeceras de seguridad viajan con la pagina, no solo con la API:
#    quien sirve el HTML es quien puede fijar la politica de contenido.
# =====================================================================
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Comprimir: el sitio son unos pocos kilobytes de texto.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 512;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # ⛔ Sin `unsafe-inline` en script-src: el unico script en linea de
  #    index.html se declara con su hash cuando se despliegue con dominio.
  #    Hasta entonces se deja 'self' y el arranque usa un bloque propio.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /salud {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'vivo';
  }

  # Las fuentes propias SI se cachean mucho: llevan el nombre de la
  # version de la fuente y no cambian.
  location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
